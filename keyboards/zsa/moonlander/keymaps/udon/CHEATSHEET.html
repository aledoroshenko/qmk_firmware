<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                margin: 24px;
                background: rgba(20, 20, 20, 0.92);
                color: #fff;
                font-size: 15px;
            }
            h1 {
                font-size: 20px;
                margin-bottom: 16px;
            }
            h2 {
                font-size: 14px;
                margin: 18px 0 8px;
                opacity: 0.8;
                text-transform: uppercase;
            }
            .row {
                display: grid;
                grid-template-columns: 180px 1fr;
                gap: 16px;
                padding: 4px 0;
            }
            .key {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            }
        </style>
    </head>
    <body>
        <h1>My Shortcuts</h1>

        <h2>Navigation</h2>
        <div class="row">
            <div class="key">⌥H</div>
            <div>Focus left split</div>
        </div>
        <div class="row">
            <div class="key">⌥L</div>
            <div>Focus right split</div>
        </div>

        <h2>Windows</h2>
        <div class="row">
            <div class="key">⌃⌥←</div>
            <div>Move window left half</div>
        </div>
        <div class="row">
            <div class="key">⌃⌥→</div>
            <div>Move window right half</div>
        </div>

        <h2>Dev</h2>
        <div class="row">
            <div class="key">⌃⌥T</div>
            <div>Open terminal here</div>
        </div>
        <div class="row">
            <div class="key">⌃⌥N</div>
            <div>New note</div>
        </div>
    </body>
</html>
